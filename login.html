<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — EcoScale AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c17; --surface:#0f1626; --surface-2:#131c30;
  --border:#1e2a44; --border-soft:#161f34;
  --text:#eef1f8; --text-dim:#8d9bbc; --text-faint:#525f80;
  --green:#3ddc97; --green-soft:#123528; --blue:#5b8def; --indigo:#8b6cf0;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --grad: linear-gradient(135deg, var(--blue), var(--indigo));
  --ease: cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
a{color:inherit; text-decoration:none;}
.card{
  width:100%; max-width:400px; background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border:1px solid var(--border); border-radius:20px; padding:36px 32px;
  box-shadow:0 50px 100px -50px rgba(0,0,0,.7);
}
.logo{font-family:var(--mono); font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:28px;}
.logo .leaf{color:var(--green);}
.logo .ai{color:var(--text-faint); font-weight:600; font-size:.85em;}
h1{font-family:var(--mono); font-size:22px; text-align:center; margin-bottom:8px;}
.sub{color:var(--text-dim); font-size:13.5px; text-align:center; margin-bottom:28px;}
label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-family:var(--mono);}
.field{margin-bottom:18px;}
input{
  width:100%; background:#0a1020; border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; color:var(--text); font-family:var(--sans); font-size:14px;
}
input:focus{outline:2px solid var(--green); outline-offset:1px; border-color:transparent;}
.btn{
  width:100%; font-family:var(--sans); font-weight:600; font-size:14.5px; padding:13px 20px;
  border-radius:10px; border:none; background:var(--grad); color:#fff; margin-top:6px;
  cursor:pointer; transition:transform .18s var(--ease);
}
.btn:hover{transform:translateY(-1px);}
.foot{margin-top:22px; text-align:center; font-size:13.5px; color:var(--text-dim);}
.foot a{color:var(--green); font-weight:600;}
.back{display:block; text-align:center; margin-top:18px; font-size:12.5px; color:var(--text-faint);}
.back:hover{color:var(--text-dim);}
</style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="logo"><span class="leaf">Eco</span>Scale<span class="ai">AI</span></a>
    <h1>Welcome back</h1>
    <p class="sub">Log in to your EcoScale dashboard.</p>
    <form onsubmit="event.preventDefault(); alert('This is a demo page — hook this up to your auth backend.');">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Log in</button>
    </form>
    <p class="foot">Don't have an account? <a href="signup.html">Sign up</a></p>
    <a href="index.html" class="back">← Back to home</a>
  </div>
</body>
</html>
