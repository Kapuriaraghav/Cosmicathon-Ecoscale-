<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — EcoScale AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c17; --surface:#0f1626; --surface-2:#131c30;
  --border:#1e2a44; --border-soft:#161f34;
  --text:#eef1f8; --text-dim:#8d9bbc; --text-faint:#525f80;
  --green:#3ddc97; --green-soft:#123528; --blue:#5b8def; --indigo:#8b6cf0;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --grad: linear-gradient(135deg, var(--blue), var(--indigo));
  --ease: cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
a{color:inherit; text-decoration:none;}
.card{
  width:100%; max-width:420px; background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border:1px solid var(--border); border-radius:20px; padding:36px 32px;
  box-shadow:0 50px 100px -50px rgba(0,0,0,.7);
}
.logo{font-family:var(--mono); font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:28px;}
.logo .leaf{color:var(--green);}
.logo .ai{color:var(--text-faint); font-weight:600; font-size:.85em;}
h1{font-family:var(--mono); font-size:22px; text-align:center; margin-bottom:8px;}
.sub{color:var(--text-dim); font-size:13.5px; text-align:center; margin-bottom:28px;}
label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-family:var(--mono);}
.field{margin-bottom:18px;}
.row{display:flex; gap:12px;}
.row .field{flex:1;}
input{
  width:100%; background:#0a1020; border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; color:var(--text); font-family:var(--sans); font-size:14px;
}
input:focus{outline:2px solid var(--green); outline-offset:1px; border-color:transparent;}
.btn{
  width:100%; font-family:var(--sans); font-weight:600; font-size:14.5px; padding:13px 20px;
  border-radius:10px; border:none; background:var(--grad); color:#fff; margin-top:6px;
  cursor:pointer; transition:transform .18s var(--ease);
}
.btn:hover{transform:translateY(-1px);}
.foot{margin-top:22px; text-align:center; font-size:13.5px; color:var(--text-dim);}
.foot a{color:var(--green); font-weight:600;}
.back{display:block; text-align:center; margin-top:18px; font-size:12.5px; color:var(--text-faint);}
.back:hover{color:var(--text-dim);}
.pip{
  margin-top:22px; font-family:var(--mono); font-size:12px; color:var(--green); background:#0a1712;
  border:1px solid var(--green-soft); padding:9px 14px; border-radius:999px; text-align:center;
}
.error-msg{
  display:none; background:#3a1414; border:1px solid #5a2020; color:#f0574f;
  font-size:13px; padding:10px 14px; border-radius:10px; margin-bottom:16px;
}
.error-msg.show{display:block;}
.success-msg{
  display:none; background:#0e2a1f; border:1px solid var(--green-soft); color:var(--green);
  font-size:13px; padding:10px 14px; border-radius:10px; margin-bottom:16px;
}
.success-msg.show{display:block;}
.btn:disabled{opacity:.6; cursor:not-allowed; transform:none;}
</style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="logo"><span class="leaf">Eco</span>Scale<span class="ai">AI</span></a>
    <h1>Create your account</h1>
    <p class="sub">Free forever on the Developer tier — upgrade anytime.</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <form id="signupForm">
      <div class="row">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Ada Lovelace" required>
        </div>
        <div class="field">
          <label for="company">Company</label>
          <input id="company" type="text" placeholder="Optional">
        </div>
      </div>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" type="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="•••••••• (min 6 chars)" required minlength="6">
      </div>
      <button type="submit" class="btn" id="signupBtn">Create account</button>
    </form>
    <p class="pip">$ pip install ecoscale — no signup required to try it locally</p>
    <p class="foot">Already have an account? <a href="login.html">Log in</a></p>
    <a href="index.html" class="back">← Back to home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://uuqhhyfjfxlipxcpklpu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1cWhoeWZqZnhsaXB4Y3BrbHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTk4OTQsImV4cCI6MjEwMjk3NTg5NH0.3i0uHut0Ss9lRiGxFaN6MTNMgIluVDCeM5H68fJ93P8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('signupForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const signupBtn = document.getElementById('signupBtn');

    // Only redirect if already logged in (check once on page load)
    let redirectChecked = false;
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session && !redirectChecked) {
        redirectChecked = true;
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 100);
      }
    }).catch(err => {
      console.error('Session check error:', err);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account...';

      const name = document.getElementById('name').value;
      const company = document.getElementById('company').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name: name, company: company } }
      });

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.add('show');
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create account';
        return;
      }

      // If email confirmation is OFF in Supabase settings, session exists immediately
      if (data.session) {
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } else {
        successMsg.textContent = 'Account created! Check your email to confirm, then log in.';
        successMsg.classList.add('show');
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
