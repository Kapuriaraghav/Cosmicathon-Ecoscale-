<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — EcoScale AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c17; --surface:#0f1626; --surface-2:#131c30;
  --border:#1e2a44; --border-soft:#161f34;
  --text:#eef1f8; --text-dim:#8d9bbc; --text-faint:#525f80;
  --green:#3ddc97; --green-soft:#123528; --blue:#5b8def; --indigo:#8b6cf0;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --grad: linear-gradient(135deg, var(--blue), var(--indigo));
  --ease: cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh;}
a{color:inherit; text-decoration:none;}
.wrap{max-width:960px; margin:0 auto; padding:0 28px;}
header{
  border-bottom:1px solid var(--border-soft); padding:20px 0;
  display:flex; align-items:center; justify-content:space-between;
}
.logo{font-family:var(--mono); font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px;}
.logo .leaf{color:var(--green);}
.logo .ai{color:var(--text-faint); font-weight:600; font-size:.85em;}
.btn{
  font-family:var(--sans); font-weight:600; font-size:13.5px; padding:9px 18px;
  border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text);
  cursor:pointer; transition:all .18s var(--ease);
}
.btn:hover{border-color:var(--text-dim); background:var(--surface);}

main{padding:60px 0;}
.welcome{margin-bottom:36px;}
.welcome .eyebrow{
  font-family:var(--mono); font-size:12px; color:var(--green); text-transform:uppercase; letter-spacing:.1em;
}
.welcome h1{font-family:var(--mono); font-size:clamp(24px,4vw,32px); margin-top:10px;}
.welcome p{color:var(--text-dim); margin-top:8px; font-size:14.5px;}

.grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px;
}
.card .k{font-family:var(--mono); font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em;}
.card .v{font-family:var(--mono); font-weight:700; font-size:26px; margin-top:10px; color:var(--green);}
@media (max-width:720px){.grid{grid-template-columns:1fr;}}

.loading{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--text-dim); font-family:var(--mono); font-size:14px;}
</style>
</head>
<body>
  <div class="loading" id="loadingScreen">Checking session...</div>

  <div id="dashboardContent" style="display:none;">
    <header>
      <div class="wrap" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
        <a href="index.html" class="logo"><span class="leaf">Eco</span>Scale<span class="ai">AI</span></a>
        <button class="btn" id="logoutBtn">Log out</button>
      </div>
    </header>
    <main>
      <div class="wrap">
        <div class="welcome">
          <span class="eyebrow">dashboard</span>
          <h1 id="welcomeText">Welcome back</h1>
          <p id="userEmail"></p>
        </div>
        <div class="grid">
          <div class="card"><div class="k">VRAM saved</div><div class="v">10.5 GB</div></div>
          <div class="card"><div class="k">Cost saved / mo</div><div class="v">$2,268</div></div>
          <div class="card"><div class="k">CO₂ saved / mo</div><div class="v">57.6 kg</div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://uuqhhyfjfxlipxcpklpu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_henEwM1b74EjnYYGBrZ_QQ_T8FQJ4k';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loadingScreen = document.getElementById('loadingScreen');
    const dashboardContent = document.getElementById('dashboardContent');
    const welcomeText = document.getElementById('welcomeText');
    const userEmail = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    (async () => {
      const { data } = await supabaseClient.auth.getSession();

      if (!data.session) {
        // Not logged in — bounce to login page
        window.location.href = 'login.html';
        return;
      }

      const user = data.session.user;
      const name = user.user_metadata?.full_name || user.email.split('@')[0];
      welcomeText.textContent = `Welcome, ${name}`;
      userEmail.textContent = user.email;

      loadingScreen.style.display = 'none';
      dashboardContent.style.display = 'block';
    })();

    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
